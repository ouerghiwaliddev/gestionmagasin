<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Changer le mot de passe</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:650px"><a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary mb-3">← Tableau de bord</a><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Changer le mot de passe</h1>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Mot de passe actuel</label><input class="form-control" type="password" name="current_password" required></div><div class="mb-3"><label class="form-label">Nouveau mot de passe</label><input class="form-control" type="password" name="new_password" minlength="8" required></div><div class="mb-3"><label class="form-label">Confirmation</label><input class="form-control" type="password" name="password_confirmation" minlength="8" required></div><button class="btn btn-primary">Enregistrer</button></form>
</div></div></main></body></html>
