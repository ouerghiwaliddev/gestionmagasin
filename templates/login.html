<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — Stock Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{min-height:100vh;background:linear-gradient(135deg,#2563eb,#1e3a8a)}.login-card{max-width:430px;border:0;border-radius:18px}</style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card login-card shadow-lg w-100"><div class="card-body p-5">
    <h1 class="h3 fw-bold mb-2">Stock Manager</h1><p class="text-muted mb-4">Connectez-vous à votre espace de gestion.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="username">Nom d’utilisateur</label><input class="form-control" id="username" name="username" required autofocus autocomplete="username"></div>
        <div class="mb-4"><label class="form-label" for="password">Mot de passe</label><input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary w-100" type="submit">Se connecter</button>
    </form>
</div></main>
</body></html>
